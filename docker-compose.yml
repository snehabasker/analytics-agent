services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      QDRANT_URL: http://qdrant:6333
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}   # empty -> falls back to the offline heuristic planner
      ANALYTICS_MODEL: ${ANALYTICS_MODEL:-claude-sonnet-5-5}
    volumes: ["traces:/app/traces"]
    depends_on: [qdrant]
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports: ["6333:6333"]
    volumes: ["qdrant:/qdrant/storage"]

volumes:
  traces:
  qdrant:
